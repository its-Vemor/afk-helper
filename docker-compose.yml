services:
  postgres:
    image: postgres:16-alpine
    container_name: afk-helper-postgres
    environment:
      POSTGRES_DB: afk_helper
      POSTGRES_USER: afk
      POSTGRES_PASSWORD: afk
    ports:
      - "5432:5432"
    volumes:
      - afk-helper-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afk -d afk_helper"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  afk-helper-pgdata:
